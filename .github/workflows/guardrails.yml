name: 'portfolio: guardrails'

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/guardrails.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/guardrails.yml'

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Format check
        run: npx prettier --check 'src/**/*.{ts,tsx,css}'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: React Doctor
        run: npx -y react-doctor@latest . --offline --yes --fail-on warning
